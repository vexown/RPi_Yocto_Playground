# playground.conf — our own DISTRO configuration.
#
# This completes the trilogy of Yocto configuration:
#   MACHINE conf  (raspberrypi5.conf, meta-raspberrypi) — what the hardware IS
#   image recipe  (playground-image.bb, our layer)      — what's INSTALLED
#   DISTRO conf   (this file)                           — how the OS BEHAVES
#
# "Distro" = policy: init manager, libc, toolchain versions, global feature
# set (DISTRO_FEATURES), package format. Until now our policy lived in two
# places: poky's defaults + an INIT_MANAGER line in local.conf. That worked,
# but local.conf is per-build-directory scratch config — wipe the build dir
# or start a second one (the Pi Zero W capstone!) and the policy is gone.
# A distro conf makes the policy part of the OS's tracked identity: the
# capstone build will be the SAME playground distro, different MACHINE.
#
# How this file gets found: bitbake.conf does
#     include conf/distro/${DISTRO}.conf
# searched along BBPATH — and our layer.conf appends ${LAYERDIR} to BBPATH.
# Setting DISTRO = "playground" in local.conf is the whole activation.
#
# Parse-order subtlety worth knowing: local.conf is parsed BEFORE the
# distro conf. That's why poky.conf assigns almost everything with "?="
# (set-if-unset): it lets your earlier local.conf values win. Our plain
# "=" assignments below therefore beat both poky's "?=" defaults AND any
# stray local.conf setting — policy now lives here, authoritatively.

# Standing on poky's shoulders instead of writing a distro from scratch:
# poky.conf brings sane QA settings, uninative (prebuilt host toolchain
# shims so sstate is shareable across host distros), security compiler
# flags, hash equivalence, SDK naming... We inherit all of it and override
# only what makes playground playground. This "require + override" pattern
# is how most real product distros start.
require conf/distro/poky.conf

# --- Identity ---------------------------------------------------------------
# These four end up verbatim in /etc/os-release on the target (the
# os-release recipe bakes ID=${DISTRO}, NAME=${DISTRO_NAME}, etc.).
# `cat /etc/os-release` after the flash is our proof this file is live.
DISTRO = "playground"
DISTRO_NAME = "Playground"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "rpi5-era"

MAINTAINER = "vexown <vexown@gmail.com>"

# NOTE what we deliberately do NOT override: TARGET_VENDOR ("-poky").
# It's embedded in the toolchain triplet (aarch64-poky-linux) and thus in
# every compiled object's task signature — renaming it would rebuild the
# WORLD for zero functional gain. Blast-radius awareness cuts both ways.

# --- Policy: init manager ----------------------------------------------------
# Moved here from local.conf (session 7 wrote it there; session 8 gives it
# a permanent home). poky.conf says INIT_MANAGER ?= "sysvinit"; our "="
# wins. Full mechanics in notes/12-systemd.md — short version: this pulls
# in init-manager-systemd.inc, which appends "systemd usrmerge" to
# DISTRO_FEATURES and points VIRTUAL-RUNTIME_init_manager at systemd,
# which is how packagegroup-core-boot picks PID 1.
INIT_MANAGER = "systemd"

# --- Policy: field-updatable (session 11) ------------------------------------
# "This OS can be updated over the air" is a property of the OS itself, not
# of one build directory — so it belongs here, next to INIT_MANAGER, and it
# will follow us to the Pi Zero W capstone unchanged.
#
# This one word is load-bearing in three separate places:
#   * meta-rauc's sanity-meta-rauc.bbclass warns at parse time if the layer
#     is present without it — a nudge that including a layer isn't enabling
#     a feature.
#   * meta-rauc-raspberrypi's rauc-integration.bbclass turns it into an
#     OVERRIDE named "rauc-integration". That's an elegant trick worth
#     stealing: recipes then write SRC_URI:append:rauc-integration = "..."
#     and the same bbappend works whether or not RAUC is enabled.
#   * via that override, the kernel gains rauc.cfg (dm-verity, squashfs,
#     loop, nbd — what bundle verification and streaming need) and
#     rpi-u-boot-scr gains the A/B boot.cmd.
#
# Note what this does NOT do: it doesn't put the rauc BINARY in the image.
# Capability vs contents — the package goes in playground-image.bb, same
# boundary session 8 drew for INIT_MANAGER vs IMAGE_INSTALL.
DISTRO_FEATURES:append = " rauc"

# --- Policy candidates we're leaving at poky defaults (for now) --------------
# DISTRO_FEATURES currently includes poky's desktop-ish extras (opengl,
# wayland, vulkan, ptest) that a headless Pi never uses. Trimming them is
# a real capstone lever — but it re-signs a big chunk of the task graph
# (another mega-rebuild), and this session's lesson is "move policy,
# change nothing", so we measure the cheap rename first. When we trim,
# it happens HERE, in one tracked line, not in local.conf.
