# 10-wifi-early.conf — load the WiFi driver stack at 8 s instead of 17 s.
#
# This file exists because of one line in the boot log:
#
#   [    8.292] systemd[1]: Load Kernel Modules was skipped because no
#                           trigger condition checks were met.
#
# systemd-modules-load.service runs early in sysinit.target and then does
# nothing at all, because nothing on this image had ever put a file in
# /usr/lib/modules-load.d or /etc/modules-load.d. Meanwhile:
#
#   [    4.232] mmc1: new high speed SDIO card at address 0001
#   [   17.311] cfg80211: Loading compiled-in X.509 certificates ...
#   [   20.575] brcmfmac: F1 signature read @0x18000000=0x1541a9a6
#
# The radio was enumerated on the SDIO bus at 4.2 s and the driver that
# talks to it was not loaded until 17.3 s. Nothing was broken in between —
# brcmfmac is loaded by udev, on demand, from the coldplug queue, and it
# simply waited its turn behind every other device on the board.
#
# WHY THAT COSTS US THE WHOLE BOOT
#
# multi-user.target on this image waits on exactly one thing:
#
#   multi-user.target @17.094s
#   `-wpa_supplicant@wlan0.service @17.052s
#     `-sys-subsystem-net-devices-wlan0.device @16.890s
#
# wlan0 does not exist until brcmfmac probes. So the finishing line is
# gated on a module that we allowed to be loaded last.
#
# This is worth doing specifically because the boot is CPU-bound rather
# than wait-bound. Measured from /proc/stat sampled just after boot, the
# single ARM11 core spent ~21.2 s busy and ~0.6 s idle across a 22 s boot
# — 97% saturated, with 0.56 s of iowait in total. On a saturated core
# there is no spare capacity to exploit, so "run more things at once"
# buys nothing. What DOES buy something is running the thing we are
# waiting for FIRST, because the total work is roughly fixed but the
# order it happens in is entirely ours to choose.
#
# WHAT THIS DOES NOT DO
#
# It does not reduce total CPU work by one cycle. Whatever udev was doing
# during those thirteen seconds still has to happen; it now happens after
# the wifi stack instead of before it. This is a reordering, not a
# removal, and if the measurement does not improve then the assumption
# that queue position was the cause is wrong.
#
# THE COST, STATED HONESTLY
#
# systemd-modules-load.service is synchronous and sysinit.target waits for
# it. Registering an SDIO driver probes any already-present matching
# device in the same call, and that probe downloads firmware to the chip —
# about 1-2 s on this hardware. So sysinit.target, and everything ordered
# after it, moves LATER by roughly that amount. The bet is that pulling
# wlan0 forward by ~9 s is worth pushing sysinit back by ~2 s. It is a
# bet, and the number after the reflash settles it.
#
# WHY ONLY ONE MODULE IS NAMED
#
# brcmfmac declares its dependencies in modules.dep, so modprobe pulls in
# cfg80211 and brcmutil ahead of it automatically. And brcmfmac-wcc — the
# vendor module Linux 6.6 split out, the one whose absence cost us a whole
# flash cycle last session — is not listed either: it is not a modules.dep
# dependency at all. brcmf_fwvid calls request_module() for it at runtime,
# after reading the chip ID off the SDIO bus and resolving BCM43430 to the
# "wcc" vendor. That happens during probe, on its own, and cannot be
# usefully pre-empted from here.
brcmfmac
