# 10-default-instance.conf — a drop-in for wpa_supplicant@.service.
#
# Two lines that fix a bug this repo shipped and caught on the first build.
#
# THE BUG. rpi0-network originally tried to switch the supplicant on with a
# preset file saying:
#
#     enable wpa_supplicant@wlan0.service
#
# The image built clean, the preset file was in the rootfs, and the unit was
# NOT enabled. No warning, no error — a silent no-op, which on a headless
# board means a device that boots and never joins the network.
#
# WHY. `systemctl preset-all` iterates over unit FILES found on disk.
# wpa_supplicant@wlan0.service is not a file; it is an instance name that
# only exists once something instantiates the template. The preset policy is
# looked up per collected unit file, so a rule naming an instance is never
# consulted. (This is also why the same preset mechanism DOES work for
# serial-logger: its recipe names the unit in SYSTEMD_SERVICE, and
# systemd.bbclass's postinst then runs `systemctl enable` on it explicitly,
# which is a different code path that handles instances fine.)
#
# Verified both ways against poky's systemd-systemctl-native — the Python
# reimplementation that actually assembles the rootfs, not the host's real
# systemd:
#
#   preset "enable wpa_supplicant@wlan0.service"  -> no symlink
#   this drop-in + "enable wpa_supplicant@.service" -> symlink created
#
# THE FIX. DefaultInstance tells systemd which instance to start when the
# TEMPLATE itself is enabled. With it, "enable wpa_supplicant@.service" in
# our preset resolves to wpa_supplicant@wlan0.service and the enablement
# symlink appears in multi-user.target.wants. It is honoured by both real
# systemd (255) and poky's script, which reads <unit>.d/*.conf drop-ins the
# same way it reads the unit.
#
# Why a drop-in rather than editing the unit: we do not own
# wpa_supplicant@.service, poky's wpa-supplicant recipe does. A drop-in adds
# to it without forking it, so a poky upgrade that changes the unit keeps
# working and this file keeps applying.

[Install]
DefaultInstance=wlan0
