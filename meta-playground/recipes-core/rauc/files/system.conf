# /etc/rauc/system.conf — the target's description of ITSELF.
#
# This is the file `rauc status` reads. It answers three questions:
#   1. What product am I?      -> compatible
#   2. Who owns boot slots?    -> bootloader
#   3. What slots exist, where -> [slot.*] sections
#
# @@COMPATIBLE@@ is substituted at build time by our rauc-conf.bbappend.

[system]
# The compatibility string is the guard rail against installing the wrong
# product's firmware. RAUC refuses a bundle whose "compatible" doesn't
# match this string EXACTLY. Ours is "${DISTRO}-${MACHINE}", so a bundle
# built for the Pi Zero W capstone can never install onto the Pi 5.
compatible=@@COMPATIBLE@@

# Which bootloader owns the slot-selection state. "uboot" tells RAUC to
# manipulate BOOT_ORDER / BOOT_x_LEFT via fw_setenv, which writes into
# U-Boot's environment block on the SD card. (RAUC also supports barebox,
# grub, efi, ... — the abstraction is the point.)
bootloader=uboot

# Persistent storage that survives an update, because it is NOT part of
# either rootfs slot. Anything you want to keep across updates must live
# on a separate partition; a slot is wholesale overwritten.
data-directory=/data/

[keyring]
# The trust anchor: bundles must be signed by a certificate chaining up to
# this CA or `rauc install` refuses. Installed by our rauc-conf.bbappend
# from meta-playground/recipes-core/rauc/files/ca.cert.pem, which is
# generated by scripts/rauc-gen-keys.sh.
path=/etc/rauc/ca.cert.pem

# --- The A/B slots -----------------------------------------------------------
# Two identical rootfs partitions from sdimage-dual-raspberrypi.wks.in:
#   p1 boot (vfat)  p2 rootfs_A  p3 rootfs_B  p5 data  p6 home
#
# "bootname" is the name the BOOTLOADER knows the slot by — it must match
# the A/B strings in boot.cmd's BOOT_ORDER. That string is the hinge between
# the two halves of this system: RAUC (Linux side) sets BOOT_ORDER="B A",
# U-Boot (boot side) reads it and picks a partition.
#
# Note the asymmetry that makes this safe: you are always running from one
# slot and writing the OTHER. The system you'd need to rescue you is never
# the one being modified.

# "resize" (session 13): after writing an ext4 image into the slot, run
# resize2fs so the filesystem fills the whole partition.
#
# Why it's needed: an install is a raw block write of the .ext4 artifact, so
# the slot ends up with a filesystem exactly as big as the one Yocto built —
# ~360 MiB in our 468 MiB partition. The extra ~108 MiB is unreachable, not
# because it's reserved but because no filesystem claims it. `df` on the
# target shows the small number and it never grows.
#
# It's one boolean because RAUC does it for us. img_to_fs_handler() in
# src/update_handler.c ends with:
#
#     if (dest_slot->resize && g_strcmp0(dest_slot->type, "ext4") == 0)
#             ext4_resize_slot(dest_slot, &ierror);
#
# — parsed per-slot in src/config_file.c, defaulting to false. (Default
# false is the right default: resize2fs is only safe when the partition is
# genuinely at least as big as the filesystem, and RAUC can't know you
# didn't point two slots at overlapping devices.)
#
# Note this is a property of the SLOT, not of the bundle: it describes the
# hardware the target actually has, which is exactly what system.conf is
# for. The same bundle installed on a board with tight partitions does the
# right thing there too, because that board's system.conf says so.

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
resize=true
