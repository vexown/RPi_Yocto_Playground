# Drop-in for dropbearkey.service — say WHEN to generate the host key.
#
# The companion half of this fix is one line in /etc/default/dropbear:
#
#     DROPBEAR_RSAKEY_DIR=/data/dropbear
#
# which both dropbearkey.service and dropbear@.service pick up through
# their `EnvironmentFile=-/etc/default/dropbear`. That line says WHERE the
# key lives, and it is enough for the generator and the server to agree.
#
# It is NOT enough on its own, because of the two lines this drop-in
# replaces. The stock unit has:
#
#     ConditionPathExists=!/etc/dropbear/dropbear_rsa_host_key
#     ConditionPathExists=!/var/lib/dropbear/dropbear_rsa_host_key
#
# Conditions take a LITERAL path. systemd does not expand
# $DROPBEAR_RSAKEY_DIR here — environment belongs to [Service], and this is
# [Unit], evaluated before any service environment exists. So once the key
# moves to /data, neither of those files ever exists again, both conditions
# stay true forever, and the generator runs on every single SSH connection.
#
# It would not overwrite the key, at least. `dropbearkey` calls
# signkey_generate(..., skip_exist=0), which writes a temp file and then
# link()s it into place; EEXIST with skip_exist=0 is treated as a hard
# failure (gensignkey.c). So the key survives and the unit just fails, every
# time, forever. A quiet permanent failure is arguably worse than a loud
# one, which is exactly why the condition has to move with the key.

[Unit]
# An empty assignment RESETS a list-valued directive. Without this line our
# path below would be APPENDED to the two stock conditions, and conditions
# are ANDed — so the unit would then also require that /etc/dropbear and
# /var/lib/dropbear be empty, which is not what we mean at all. This reset
# idiom works for most list directives (After=, Wants=, Environment=, ...)
# and is the main thing that makes drop-ins able to subtract, not just add.
ConditionPathExists=
ConditionPathExists=!/data/dropbear/dropbear_rsa_host_key

# The stock unit waits for /var and /var/lib because that is where it might
# have put the key. Ours is on a different filesystem entirely — p5, mounted
# at /data by fstab — so we must declare that dependency ourselves or the
# generator can race the mount and write the key into the empty mountpoint
# directory underneath it, where it vanishes the moment /data mounts over.
#
# In practice this is belt-and-braces: dropbearkey.service has no [Install]
# section, so nothing starts it at boot. It is pulled in by
# `Wants=dropbearkey.service` in dropbear@.service, i.e. on the first
# incoming SSH connection, by which time /data has been mounted for a long
# time. Correct anyway, and free.
RequiresMountsFor=/data
