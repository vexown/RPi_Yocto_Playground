# journald size cap for the Pi Zero W logger.
#
# Measured 2026-11-06: the persistent journal had reached 9.8 MB of a 100 MB
# rootfs in about a month and had not yet deleted anything. That was not a
# setting anyone chose. With nothing configured, journald allows itself 10%
# of the filesystem it lives on, so the cap was an accident of the rootfs
# size and would have grown with any larger rootfs.
#
# 8 MB is a decision instead: several boots of history (each boot is a few
# hundred KB on this image) on a rootfs with ~23 MB free. Past it, journald
# deletes the oldest journal files first.
#
# The journal stays PERSISTENT (on the SD card). On a headless board that
# is the one record of a boot that went wrong, readable after the fact even
# with the card pulled and read on a PC. Whether to keep it in RAM instead
# is a decision for the read-only-rootfs work, not this file.

[Journal]
SystemMaxUse=8M
