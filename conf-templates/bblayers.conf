# bblayers.conf — which layers BitBake sees.
# Tracked in the repo; copied into the build dir by scripts/setup-yocto.sh.

POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

YOCTO_ROOT = "/media/blankmcu/EmbeddedLinux/yocto"
# Our own layer lives in this repo (it's the light, trackable stuff),
# unlike the cloned layers which live on the build disk.
REPO_ROOT = "/home/blankmcu/Repos/RPi_Yocto_Playground"

# Session 11 (OTA) adds three cloned layers. Note that meta-rauc-community
# is a CONTAINER of per-board sub-layers — you add the board you want, not
# the repo root. meta-lts-mixins carries a newer U-Boot (2025.04) than
# scarthgap's oe-core (2024.01). Both recipes are named u-boot, so BitBake
# must pick one, and it picks by LAYER PRIORITY first: lts-mixins sits at
# BBFILE_PRIORITY 6, oe-core at 5, so only lts-mixins' recipes are in the
# running. Version is compared only between recipes of equal priority;
# PREFERRED_VERSION_u-boot would override both (we don't set it).
# (bitbake/lib/bb/providers.py: sortPriorities, findBestProvider.)
# Its layer.conf also prepends itself to BBPATH; that affects conf/ and
# classes/ lookup, not which recipe wins — recipes come from BBFILES.
# Check with: bitbake-layers show-overlayed
BBLAYERS ?= " \
  ${YOCTO_ROOT}/poky/meta \
  ${YOCTO_ROOT}/poky/meta-poky \
  ${YOCTO_ROOT}/poky/meta-yocto-bsp \
  ${YOCTO_ROOT}/meta-lts-mixins \
  ${YOCTO_ROOT}/meta-raspberrypi \
  ${YOCTO_ROOT}/meta-rauc \
  ${YOCTO_ROOT}/meta-rauc-community/meta-rauc-raspberrypi \
  ${REPO_ROOT}/meta-playground \
  "
